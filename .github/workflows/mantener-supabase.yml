# =========================================================
# Mantiene despiertos los proyectos gratis de Supabase.
# Supabase pausa los proyectos gratis tras 7 días sin uso;
# esta tarea los consulta cada 3 días para que eso no pase.
# Usa solo las claves "publishable" (públicas).
# =========================================================
name: Mantener Supabase despierto

on:
  schedule:
    - cron: "17 13 */3 * *"   # cada 3 días, 8:17 a. m. en Colombia
  workflow_dispatch: {}        # también se puede correr a mano en la pestaña Actions

jobs:
  despertar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar los proyectos
        run: |
          # Cualquier respuesta de la base (200 o 401) cuenta como actividad.
          # Solo falla si el proyecto no responde o ya está pausado.
          check () {
            code=$(curl -s -o /dev/null -w "%{http_code}" "$2" -H "apikey: $3")
            echo "$1: $code"
            case "$code" in 2*|401|403|404) ;; *) echo "::error::$1 no respondió ($code). Entra a Supabase y toca Restore."; exit 1;; esac
          }
          check "Time Capsule" "https://frascwpukyygsaeeohnr.supabase.co/rest/v1/capsules_feed?select=id&limit=1" "sb_publishable_HlD6zjfxofaUGFguDr5yNQ_7K5CVBPY"
          check "Guardián" "https://jktmtdpgvjlrdxqmdbrp.supabase.co/rest/v1/species?select=id&limit=1" "sb_publishable_Z33OvW2c8XZvI7G9AbgrRA_N4yqqYwi"
