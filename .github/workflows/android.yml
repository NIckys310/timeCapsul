# Revisa Time Capsule en cada cambio: pruebas automáticas, análisis de Android (lint) y APK.
name: Pruebas de Time Capsule

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas automáticas (fechas, cápsulas, borrador, seguridad…)
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Análisis de Android (lint)
        run: ./gradlew :app:lintDebug --console=plain
      - name: Crear el APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Guardar el APK y los reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-capsule
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          if-no-files-found: ignore
